<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121110">
<title>A S Battle Royale</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#121110;--card:#1b1a18;--or:#e8590c;--tx:#f3efe9;--mu:#a39d94;--ln:#2e2c29}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Noto Sans Devanagari",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:24px;margin:6px 0 4px}h3{margin:0 0 8px;font-size:17px}
p{margin:4px 0;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:10px 0}
.big{font-size:18px;font-weight:700;color:var(--tx)}
.tabs{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:8px 0;scrollbar-width:none;z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tab,.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.tab.on,.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
button.b{background:var(--or);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin-top:8px}
button.b.g{background:#2e2c29}button.b.s{padding:6px 10px;font-size:14px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit;margin-top:8px}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.mu{color:var(--mu);font-size:14px}
.amts{display:flex;flex-wrap:wrap;gap:8px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 4px;text-align:left;border-bottom:1px solid var(--ln)}
th{color:var(--mu);font-weight:500;font-size:14px}
#qr{display:inline-block;background:#fff;padding:10px;border-radius:10px;margin:8px 0}
#pinBox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;align-items:center;justify-content:center;padding:20px}
#pinBox .card{width:100%;max-width:340px;margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--or);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
.top{display:flex;justify-content:space-between;align-items:flex-start}
</style></head>

function mkDB(){
 const K="esports_db",subs={};
 const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}};
 const save=d=>localStorage.setItem(K,JSON.stringify(d));
 const notify=c=>(subs[c]||[]).forEach(f=>f());
 const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
 const apply=(o,v)=>{const r={...o};for(const k in v){r[k]=(v[k]&&v[k].__inc!=null)?(+r[k]||0)+v[k].__inc:v[k]}return r};
 const snap=c=>({docs:Object.entries(load()[c]||{}).map(([id,v])=>({id,data:()=>v}))});
 const ref=(c,id)=>{const r={c,id:id||rid()};
  r.delete=()=>{const d=load();if(d[c])delete d[c][r.id];save(d);notify(c);return Promise.resolve()};
  r.update=v=>{const d=load();d[c]=d[c]||{};d[c][r.id]=apply(d[c][r.id]||{},v);save(d);notify(c);return Promise.resolve()};
  r.set=v=>{const d=load();d[c]=d[c]||{};d[c][r.id]=apply({},v);save(d);notify(c);return Promise.resolve()};
  return r};
 addEventListener("storage",e=>{if(e.key==K)Object.keys(subs).forEach(notify)});
 return{
  collection:c=>({
   doc:id=>ref(c,id),
   add:v=>{const r=ref(c);return r.set(v).then(()=>({id:r.id}))},
   onSnapshot:cb=>{(subs[c]=subs[c]||[]).push(()=>cb(snap(c)));setTimeout(()=>cb(snap(c)),0);return()=>{}}
  }),
  batch:()=>{const ops=[];return{update:(r,v)=>ops.push(()=>r.update(v)),set:(r,v)=>ops.push(()=>r.set(v)),delete:r=>ops.push(()=>r.delete()),commit:()=>{ops.forEach(f=>f());return Promise.resolve()}}}
 }
}

${amt?`<div style="text-align:center"><p>₹${amt} भेजो · बचा समय: <b id="tm">${left}</b> सेकंड</p><div id="qr"></div><br><a href="${link}"><button class="b">📲 UPI ऐप खोलो</button></a><br><button class="b g" onclick="payDone()">मैंने पेमेंट कर दिया</button></div>`:""}</div>
<div class="card"><h3>💸 विथड्रॉ</h3><p>कम से कम 25 कॉइन।</p><input id="wc" type="number" min="25" placeholder="कॉइन की संख्या"><input id="wu" placeholder="आपकी UPI ID"><button class="b" onclick="withdraw()">विथड्रॉ रिक्वेस्ट भेजो</button></div>
${org?`<div class="card"><h3>📤 विथड्रॉ रिक्वेस्ट</h3>${S.wds.map(w=>`<div class="row"><div><b>${esc(w.teamName)}</b> · ${w.coins} कॉइन<div class="mu">${esc(w.upi)}</div></div><button class="b s" onclick="del('withdrawals','${w.id}')">✓ भुगतान हो गया</button></div>`).join("")||"<p>कोई रिक्वेस्ट नहीं।</p>"}</div>`:""}`}
};

/* ---------- ड्रॉ ---------- */
function draw(f){
  const a=document.activeElement;if(!f&&a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
  $("#tabs").innerHTML=TABS.map(([k,n])=>`<button class="tab ${k==tab?"on":""}" onclick="tab='${k}';draw(1)">${n}</button>`).join("");
  $("#view").innerHTML=V[tab]();
  if(tab=="wd"&&amt)new QRCode($("#qr"),{text:`upi://pay?pa=${UPI}&pn=eSports&am=${amt}&cu=INR&tn=Coins`,width:180,height:180});
}
const nextSun=()=>{const d=new Date();d.setDate(d.getDate()+(7-d.getDay())%7);return d};
const dkey=d=>d.toISOString().slice(0,10);
const need=()=>{if(!db){toast("Firebase सेटअप बाकी है");return 0}return 1};
const val=id=>($("#"+id).value||"").trim();
const del=(c,id)=>db.collection(c).doc(id).delete().catch(e=>toast(e.code));

/* ---------- एक्शन ---------- */
async function register(){if(!need())return;
  const n=val("rn"),c=val("rc"),u=val("ru"),m=$("#rm").value;
  if(!n||!c||!u)return toast("सारी जानकारी भरो");
  if(S.teams.some(t=>t.name.toLowerCase()==n.toLowerCase()))return toast("यह टीम नाम पहले से है");
  const rf=val("rf").toUpperCase(),rt=rf?S.teams.find(t=>refCode(t)==rf):null;
  if(rf&&!rt)return toast("रेफरल कोड सही नहीं है");
  const r=await db.collection("teams").add({name:n,captain:c,uid:u,mode:m,coins:0,kills:0,rp:0,refBy:rt?rt.id:"",ts:Date.now()});
  localStorage.removeItem("refBy");localStorage.myTeam=r.id;toast("टीम रजिस्टर हो गई ✅");tab="prof";draw(1)}
async function postAn(){const t=val("an");if(!t)return;await db.collection("announce").add({text:t,ts:Date.now()});draw(1)}
async function sendMsg(){if(!need())return;const n=val("pn"),t=val("pm");if(!n||!t)return toast("नाम और मैसेज लिखो");
  await db.collection("inbox").add({name:n,text:t,ts:Date.now()});toast("मैसेज भेज दिया ✅");draw(1)}
async function addMatch(){const n=val("mn"),t=val("mt");if(!n||!t)return toast("नंबर और समय भरो");
  await db.collection("matches").add({no:n,time:t,mode:$("#mm").value,note:val("mo"),room:val("mr"),pass:val("mp")});toast("मैच जुड़ गया ✅");draw(1)}
async function saveRoom(id){await db.collection("matches").doc(id).update({room:val("r_"+id),pass:val("p_"+id)});toast("Room ID/पासवर्ड सेव हो गया ✅");draw(1)}
async function addScore(){const id=$("#st").value,k=+val("sk")||0,r=+val("sr")||0;if(!id)return;
  const pr=+pz()["r"+r]||0,b=db.batch();
  b.update(db.collection("teams").doc(id),{kills:FV.increment(k),rp:FV.increment(rankPts(r)),...(pr>0?{coins:FV.increment(pr)}:{})});
  if(pr>0)b.set(db.collection("txns").doc(),{teamId:id,text:"मैच इनाम (रैंक "+r+")",coins:pr,ts:Date.now()});
  await b.commit();toast(pr>0?"स्कोर जुड़ा, "+pr+" कॉइन इनाम मिल गया 🏆":"स्कोर जुड़ गया ✅");draw(1)}
async function savePrizes(){const v=n=>Math.max(0,Math.floor(+val(n)||0));
  await db.collection("settings").doc("prizes").set({r1:v("pz1"),r2:v("pz2"),r3:v("pz3"),ref:v("pz4")});toast("इनाम सेव हो गया ✅");draw(1)}
async function freeEntry(){if(!need())return;const id=$("#ft").value;if(!id)return toast("टीम चुनो");
  const k=dkey(nextSun()),docId=id+"_"+k;
  if(S.free.some(f=>f.id==docId))return toast("इस रविवार की एंट्री पहले ले ली है");
  await db.collection("freeEntries").doc(docId).set({teamId:id,teamName:team(id).name,mode:$("#fm").value,date:k,ts:Date.now()});toast("फ्री एंट्री मिल गई 🎁")}
function pick(n){amt=n;left=60;clearInterval(tmr);tmr=setInterval(()=>{left--;const e=$("#tm");if(e)e.textContent=left;if(left<=0){clearInterval(tmr);amt=null;toast("समय खत्म, दोबारा रकम चुनो");draw(1)}},1000);draw(1)}
async function payDone(){if(!need())return;const id=$("#ct").value||mine();if(!id)return toast("पहले अपनी टीम चुनो");
  await db.collection("coinReqs").add({teamId:id,teamName:team(id).name,coins:amt,ts:Date.now()});
  clearInterval(tmr);amt=null;toast("रिक्वेस्ट भेज दी। आयोजक की पुष्टि का इंतज़ार करो ⏳");draw(1)}
async function approve(id){const r=S.reqs.find(x=>x.id==id),b=db.batch();
  b.update(db.collection("teams").doc(r.teamId),{coins:FV.increment(r.coins)});
  b.set(db.collection("txns").doc(),{teamId:r.teamId,text:"UPI से कॉइन जोड़े",coins:r.coins,ts:Date.now()});
  const ft=team(r.teamId),bn=+pz().ref||0,rr=ft&&ft.refBy?team(ft.refBy):null;
  if(bn>0&&rr&&!ft.refPaid){b.update(db.collection("teams").doc(rr.id),{coins:FV.increment(bn)});
    b.set(db.collection("txns").doc(),{teamId:rr.id,text:"रेफरल बोनस ("+ft.name+")",coins:bn,ts:Date.now()});
    b.update(db.collection("teams").doc(ft.id),{refPaid:true})}
  b.delete(db.collection("coinReqs").doc(id));await b.commit();toast("कॉइन जुड़ गए ✅")}
async function withdraw(){if(!need())return;const id=mine(),c=+val("wc"),u=val("wu"),t=team(id);
  if(!t)return toast("प्रोफाइल में अपनी टीम चुनो");
  if(c<25)return toast("कम से कम 25 कॉइन");
  if(c>(t.coins||0))return toast("इतने कॉइन नहीं हैं");
  if(!u.includes("@"))return toast("सही UPI ID डालो");
  const b=db.batch();
  b.update(db.collection("teams").doc(id),{coins:FV.increment(-c)});
  b.set(db.collection("withdrawals").doc(),{teamId:id,teamName:t.name,coins:c,upi:u,ts:Date.now()});
  b.set(db.collection("txns").doc(),{teamId:id,text:"विथड्रॉ रिक्वेस्ट",coins:-c,ts:Date.now()});
  await b.commit();toast("विथड्रॉ रिक्वेस्ट भेज दी ✅");draw(1)}

draw(1);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
